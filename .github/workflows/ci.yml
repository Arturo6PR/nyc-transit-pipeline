name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,analytics]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: Offline CLI smoke test
        env:
          TRANSITPULSE_DATABASE: ${{ github.workspace }}/smoke.duckdb
        run: >-
          transitpulse ingest examples/mta_sample.pb64
          --database smoke.duckdb
          --source mta-sample
          --format json
          --output smoke-report.json
      - name: Offline schedule smoke test
        run: >-
          transitpulse schedule ingest examples/gtfs_schedule
          --database smoke.duckdb
          --source mta-sample
          --format json
          --output schedule-report.json
      - name: Build and test analytical marts
        env:
          TRANSITPULSE_DATABASE: ${{ github.workspace }}/smoke.duckdb
        run: dbt build --project-dir analytics --profiles-dir analytics
