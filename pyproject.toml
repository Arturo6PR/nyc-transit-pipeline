[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "transitpulse"
version = "0.1.0"
description = "Replayable GTFS-Realtime ingestion and transit reliability analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Arturo6PR" }]
keywords = ["data-engineering", "gtfs-realtime", "transit", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "duckdb>=1.2,<2",
  "gtfs-realtime-bindings>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
transitpulse = "transitpulse.cli:main"

[project.urls]
Repository = "https://github.com/Arturo6PR/nyc-transit-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/transitpulse"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["transitpulse"]
